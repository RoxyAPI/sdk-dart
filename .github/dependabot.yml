version: 2
updates:
  # Wait 3 days before opening a bump PR so freshly published versions get a chance to be
  # flagged for supply-chain issues before they land.
  - package-ecosystem: pub
    directories: ["/", "/example/flutter_app"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
